[project]
name = "market-price-checker"
version = "0.1.0"
description = "Cross-site market price checker"
authors = [{name = "User", email = "user@example.com"}]
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.30.0",
    "playwright>=1.40.0",
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_price_checker"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
]
