name: Demo Workflow

on: [push, workflow_dispatch]

jobs:
  hello-world:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello, GitHub Actions! This is a test from Antigravity."

      - name: Check System Info
        run: |
          echo "Running on:"
          uname -a
          echo "Python version:"
          python3 --version
